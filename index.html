<!doctype html>
<html>
    <head>

        <link href="./output.css" rel="stylesheet">
        <script src="./Scripts/main.mjs"></script>
    </head>

    <body onload="exclusion()" style="overflow: hidden;" class="bg-amber-100">
        <div class="justify-self-center bg-amber-600 pt-5 pb-3 shadow-2xl">
            <h1 class="text-6xl font-bold text-center mt-5">

                    <label class="text-xl p-2"><input class="px-2" type="checkbox" name="students" value=2>Cristian</label>
                    <label class="text-xl p-2"><input class="px-2" type="checkbox" name="students" value=3>Jacob</label>
                    <br>
                    <label class="text-xl p-2"><input class="px-2" type="checkbox" name="students" value=4>Akari</label>
                    <label class="text-xl p-2"><input class="px-2" type="checkbox" name="students" value=5>James</label>
                    <label class="text-xl p-2"><input class="px-2" type="checkbox" name="students" value=6>Cayden</label>
                    <label class="text-xl p-2"><input class="px-2" type="checkbox" name="students" value=7>Maysem</label>
                    <br>
                    <label class="text-xl p-2"><input class="px-2" type="checkbox" name="students" value=8>Justin</label>
                    <label class="text-xl p-2"><input class="px-2" type="checkbox" name="students" value=9>Nels</label>
                    <label class="text-xl p-2"><input class="px-2" type="checkbox" name="students" value=10>Kosta</label>
                    <label class="text-xl p-2"><input class="px-2" type="checkbox" name="students" value=11>Adam</label>
                    <label class="text-xl p-2"><input class="px-2" type="checkbox" name="students" value=12>Daemion</label>
                </div>
                <br>

                <div class="justify-self-center mt-22">
                    <button type="submit" class="bg-amber-600 text-4xl px-4 py-2 rounded-2xl">
                        Randomize
                    </button>
                </div>
            </form>
        </div>
    </body>
</html>
